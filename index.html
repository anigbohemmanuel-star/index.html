
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101116">
<title>Gabriella AI</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#191a22;--line:#2b2c37;--purple:#b49aff;--text:#f4f2fa;--muted:#a3a2b1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.app{min-height:100vh;display:flex}
.sidebar{width:245px;background:#15161d;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.brand{font-size:24px;font-weight:800;padding:8px 3px 18px;letter-spacing:-1px}
.brand span{color:var(--purple)}
.new,.history button{width:100%;text-align:left;border:1px solid var(--line);background:transparent;padding:12px;border-radius:12px}
.new{background:#24212f;border-color:#454057}
.small{color:var(--muted);font-size:11px;margin:12px 4px 0}
.history{display:grid;gap:6px}
.history button{border-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6d4df}
.bottom{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.7;padding:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.status{color:#b9b0d9;font-size:12px}
.content{width:100%;max-width:820px;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:28px 20px 18px}
.welcome{margin:auto 0;text-align:center;padding:30px 0}
.logo{width:55px;height:55px;margin:0 auto 20px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(135deg,#c9b8ff,#7858b8);color:#171222;font-size:28px;font-weight:800}
h1{font-size:clamp(27px,5vw,40px);letter-spacing:-1.4px;margin:0 0 12px}
.welcome p{color:var(--muted);line-height:1.7;margin:0 auto 27px;max-width:440px}
.prompts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:590px;margin:auto}
.prompts button{background:var(--panel);border:1px solid var(--line);text-align:left;border-radius:14px;padding:15px;line-height:1.45}
.prompts button span{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.prompts button:hover,.new:hover{border-color:#8270ad}
.messages{display:flex;flex-direction:column;gap:22px;padding-bottom:20px}
.msg{max-width:88%;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:#292537;padding:12px 15px;border-radius:17px 17px 5px 17px}
.msg.bot{align-self:flex-start}
.msg.bot b{display:block;color:var(--purple);font-size:12px;margin-bottom:5px}
.composer-wrap{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 20%);padding:20px 0 4px}
.composer{display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid #383744;border-radius:19px;padding:10px}
.composer:focus-within{border-color:#8e79bd}
textarea{flex:1;resize:none;max-height:150px;min-height:42px;border:0;outline:0;background:transparent;color:var(--text);padding:10px 4px}
textarea::placeholder{color:#898796}
.send{width:42px;height:42px;border:0;border-radius:13px;background:var(--purple);color:#171222;font-size:20px;font-weight:700}
.note{text-align:center;font-size:11px;color:#777685;margin:11px 0 0}
.mobile-menu{display:none;background:transparent;border:0;font-size:22px}
@media(max-width:650px){
.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:270px;transform:translateX(-105%);transition:transform .2s}
.sidebar.open{transform:translateX(0);box-shadow:10px 0 50px #0008}
.mobile-menu{display:block}
.top{padding:0 15px}
.content{padding:20px 14px 12px}
.welcome{padding:22px 0}
.prompts{grid-template-columns:1fr}
.prompts button{padding:13px}
.msg{max-width:95%}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand">Gabriella<span>.</span></div>
<button class="new" id="newChat">＋ &nbsp; New chat</button>
<div class="small">RECENT CHATS</div>
<div class="history" id="history"></div>
<div class="bottom">Gabriella AI<br>Here to help you think, create and explore.</div>
</aside>
<main class="main">
<header class="top">
<div style="display:flex;align-items:center;gap:12px">
<button class="mobile-menu" id="menu" aria-label="Open menu">☰</button>
<strong>Gabriella AI</strong>
</div>
<span class="status" id="status">● Ready to help</span>
</header>
<section class="content">
<div id="welcome" class="welcome">
<div class="logo">G</div>
<h1>What can I help you with?</h1>
<p>Ask a question, explore an idea, or start creating something new.</p>
<div class="prompts">
<button data-prompt="Help me develop a new idea.">✦ Develop an idea<span>Turn your thoughts into a plan</span></button>
<button data-prompt="Explain a difficult topic in simple terms.">◈ Learn something<span>Make a complex topic simple</span></button>
<button data-prompt="Help me write a clear, professional message.">✎ Write something<span>Messages, emails and more</span></button>
<button data-prompt="Help me make a plan and decide my next steps.">⌁ Make a plan<span>Organize your next steps</span></button>
</div>
</div>
<div id="messages" class="messages" hidden></div>
<div class="composer-wrap">
<form id="chatForm" class="composer">
<textarea id="prompt" rows="1" placeholder="Message Gabriella..." aria-label="Message Gabriella"></textarea>
<button class="send" id="sendButton" aria-label="Send message" type="submit">↑</button>
</form>
<div class="note" id="note">Connecting to Gabriella AI…</div>
</div>
</section>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
let chats=[],current=null,busy=false;

function fresh(){
 current={title:"New chat",items:[]};
 chats.unshift(current);
 renderHistory();
 showWelcome();
 $("prompt").focus();
 $("sidebar").classList.remove("open");
}
function showWelcome(){
 $("welcome").hidden=false;
 $("messages").hidden=true;
 $("messages").innerHTML="";
}
function renderHistory(){
 $("history").innerHTML="";
 chats.slice(0,12).forEach(c=>{
  const b=document.createElement("button");
  b.textContent=c.title;
  b.onclick=()=>openChat(c);
  $("history").appendChild(b);
 });
}
function openChat(c){
 current=c;
 $("welcome").hidden=true;
 $("messages").hidden=false;
 $("messages").innerHTML="";
 c.items.forEach(m=>addBubble(m.role,m.text));
 $("sidebar").classList.remove("open");
}
function addBubble(role,text){
 const d=document.createElement("div");
 d.className="msg "+(role==="user"?"user":"bot");
 if(role==="bot"){
  const b=document.createElement("b");
  b.textContent="Gabriella";
  d.appendChild(b);
 }
 const t=document.createElement("div");
 t.textContent=text;
 d.appendChild(t);
 $("messages").appendChild(d);
}
async function send(text){
 text=text.trim();
 if(!text||busy)return;

 if(!current){
  current={title:text.slice(0,32),items:[]};
  chats.unshift(current);
 }
 if(current.items.length===0)current.title=text.slice(0,32);

 const activeChat=current;
 activeChat.items.push({role:"user",text});
 $("welcome").hidden=true;
 $("messages").hidden=false;
 addBubble("user",text);
 $("prompt").value="";
 $("prompt").style.height="auto";
 renderHistory();

 busy=true;
 $("sendButton").disabled=true;
 $("status").textContent="● Thinking…";
 $("note").textContent="Gabriella is preparing a response…";

 const loading=document.createElement("div");
 loading.className="msg bot";
 loading.textContent="Gabriella is thinking…";
 $("messages").appendChild(loading);

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:text})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"AI request failed");

  const answer=data.reply;
  if(!answer)throw new Error("The server returned an empty reply");

  loading.remove();
  activeChat.items.push({role:"bot",text:answer});
  if(current===activeChat)addBubble("bot",answer);
  $("note").textContent="Connected to Gabriella AI";
  $("status").textContent="● Ready to help";
 }catch(error){
  loading.remove();
  const message="I couldn't connect to Gabriella's AI service. Please check the Render deployment and API key, then try again.";
  activeChat.items.push({role:"bot",text:message});
  if(current===activeChat)addBubble("bot",message);
  $("note").textContent="AI connection failed";
  $("status").textContent="● Connection issue";
  console.error("Gabriella API error:",error);
 }finally{
  busy=false;
  $("sendButton").disabled=false;
  renderHistory();
 }
}
$("chatForm").addEventListener("submit",e=>{
 e.preventDefault();
 send($("prompt").value);
});
$("prompt").addEventListener("input",e=>{
 e.target.style.height="auto";
 e.target.style.height=Math.min(e.target.scrollHeight,150)+"px";
});
$("prompt").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  $("chatForm").requestSubmit();
 }
});
document.querySelectorAll("[data-prompt]").forEach(b=>
 b.addEventListener("click",()=>send(b.dataset.prompt))
);
$("newChat").onclick=fresh;
$("menu").onclick=()=>$("sidebar").classList.toggle("open");
$("note").textContent="Messages are sent to the Gabriella backend.";
</script>
</body>
</html>
